[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-to-vulcan"
version = "0.1.0"
description = "Visual ONNX-to-Vulkan compute compiler"
readme = "README.md"
requires-python = ">=3.11"
authors = []
dependencies = [
    "jsonschema>=4.22",
    "onnx>=1.16,<2",
    "psutil>=6,<8",
    "py7zr>=0.22,<1",
    "rarfile>=4.2,<5",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
]
web = [
    "fastapi>=0.116,<1",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.35,<1",
]
verify = [
    "onnxruntime>=1.20,<2",
    "vulkan>=1.3.275,<2",
]

[project.scripts]
ttv = "torch_to_vulcan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
torch_to_vulcan = ["vendor/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
