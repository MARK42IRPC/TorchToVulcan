[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-to-vulcan"
version = "0.1.0"
description = "Visual ONNX-to-Vulkan compute compiler"
readme = "README.md"
requires-python = ">=3.11"
authors = []
dependencies = [
    "onnx>=1.16,<2",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.22",
]

[project.scripts]
ttv = "torch_to_vulcan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
